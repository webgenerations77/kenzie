# Filter rules for filter.py.
#
# Words are matched case-insensitively as whole words/phrases (so "1996" does
# not match "19960"). *_patterns entries are Python regular expressions, also
# case-insensitive, for spelling variants people use in titles.

# Which parts of each video's metadata are checked.
fields: [title, description, tags]

# A result is kept only if at least one keep word or pattern matches.
keep:
  - "1996"
  - "12/31/96"
  - "Flecktones"
  - "Live Trax 7"
keep_patterns:
  - '12[./-]31[./-](19)?96'                          # 12.31.96, 12-31-1996, ...
  - 'live\s*trax\s*(vol(ume)?\.?\s*)?(#\s*)?7\b'      # Live Trax Vol. 7, Live Trax #7
  - 'fleck\s*tones'                                   # Fleck Tones

# Anything matching an exclude word or pattern is dropped, even if it also
# matched a keep word. DMB also played Hampton on New Year's Eve 1995.
exclude:
  - "1995"
  - "12/30"
exclude_patterns:
  - '12[./-]30\b'                                     # 12.30, 12-30
  - '12[./-]31[./-](19)?95'                           # 12.31.95

# Audio-only detection. Kept results that look audio-only go to
# output/audio_only.csv instead of the shortlist.
#   strong: any single hit means audio-only.
#   weak:   means audio-only unless a video hint is also present.
audio_only:
  strong:
    - "audio only"
    - "provided to youtube by"
    - "auto-generated by youtube"
    - "no video"
    - "static image"
  weak:
    - "audio"
    - "soundboard"
    - "sbd"
    - "aud"
    - "matrix"
    - "mp3"
    - "flac"
    - "live trax"
  video_hints:
    - "video"
    - "camcorder"
    - "footage"
    - "pro-shot"
    - "proshot"
    - "pro shot"
    - "fan shot"
    - "vhs"
    - "filmed"
    - "camera"
    - "multicam"

# Words that make a clip more relevant to what we most want: the midnight
# countdown and Tripping Billies. Each hit raises the "focus" score used to
# sort the shortlist.
focus:
  - "tripping billies"
  - "midnight"
  - "countdown"
  - "balloon"
  - "balloons"
  - "auld lang syne"
  - "happy new year"
  - "new year's eve"
  - "new years eve"
  - "nye"

# Reupload detection. Two results are treated as the same upload when their
# durations are within duration_tolerance_seconds AND either their titles are
# at least title_similarity alike (0-1) or both are longer than
# long_clip_seconds (long identical-length videos are almost always copies).
# The earliest upload is kept; the others are listed in the "reuploads" column.
dedupe:
  duration_tolerance_seconds: 2
  title_similarity: 0.6
  long_clip_seconds: 600
